                const fromSelect = document.getElementById('inputepsg');
                const toSelect = document.getElementById('outputepsg');
                const temp = fromSelect.value;
                fromSelect.value = toSelect.value;
                toSelect.value = temp;
                
                // Also swap the values if they exist
                const amountInput = document.getElementById('inputxy');
                const resultInput = document.getElementById('outputxy');
                if (amountInput.value && resultInput.value) {
                    const tempVal = amountInput.value;
                    amountInput.value = resultInput.value;
                    resultInput.value = tempVal;
                }
            });
</script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/sc.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
